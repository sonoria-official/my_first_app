<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>inPage(インページ) - SNS×音楽ライブアプリ</title>
    <meta name="description" content="inPage(インページ)は、好きなアーティストと繋がり、ライブの感動をシェアできるSNS×音楽ライブアプリです。タップしてアプリを体験しましょう。運営: SoNoRIA Stream">

    <!-- OGP(SNSでシェアされた際の表示) -->
    <meta property="og:title" content="inPage(インページ) - SNS×音楽ライブアプリ">
    <meta property="og:description" content="好きなアーティストと繋がり、ライブの感動をシェアできる音楽SNS「inPage」。">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="inPage">

    <link rel="stylesheet" href="style.css">
    <style>
        .redirect-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #5c4331, #2c1e14);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .redirect-logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .redirect-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #ff4500;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .redirect-text {
            font-size: 16px;
            color: #dfdfdf;
            margin-bottom: 30px;
        }
        .redirect-manual-btn {
            background-color: #ff4500;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        /* PC向けQRコード表示エリア */
        .qr-box {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        .qr-box img {
            width: 220px;
            height: 220px;
            background: white;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 24px;
        }
        .qr-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .qr-text {
            font-size: 15px;
            color: #dfdfdf;
            max-width: 360px;
            line-height: 1.7;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="redirect-logo">inPage</div>

        <!-- スマホ用: アプリ自動起動 -->
        <div id="mobileBox">
            <div class="redirect-spinner"></div>
            <p class="redirect-text">アプリを起動しています...</p>
            <a href="#" id="manualBtn" class="redirect-manual-btn" style="display:none;">
                アプリを開く / インストールする
            </a>
        </div>

        <!-- PC用: QRコード表示 -->
        <div id="qrBox" class="qr-box">
            <p class="qr-title">スマホでQRコードを読み取ってください</p>
            <img id="qrImage" src="" alt="inPageアプリを開くQRコード">
            <p class="qr-text">inPageはスマホアプリです。<br>お使いのスマートフォンのカメラでこのQRコードを読み取ると、アプリが開きます。</p>
        </div>
    </div>

    <script>
        // 🌟 アプリへの導線となるカスタムURLスキーム
        const APP_SCHEME = "sonoria://open";

        // 🌟 ストアのURL(まだ未公開のため仮のプレースホルダー)
        const IOS_STORE_URL = "https://apps.apple.com/app/idXXXXXXXXXX"; // ← 公開後に差し替え
        const ANDROID_STORE_URL = "https://play.google.com/store/apps/details?id=com.SoNoRIA.inPage"; // ← 公開後に確認

        const ua = navigator.userAgent;
        const isMobile = /iPhone|iPad|iPod|Android/i.test(ua);

        if (isMobile) {
            // ===== スマホ: 今まで通り自動でアプリを開こうとする =====
            function getStoreUrl() {
                if (/iPhone|iPad|iPod/i.test(ua)) return IOS_STORE_URL;
                if (/Android/i.test(ua)) return ANDROID_STORE_URL;
                return null;
            }

            function goToStoreOrFallback() {
                const storeUrl = getStoreUrl();
                const manualBtn = document.getElementById("manualBtn");
                if (storeUrl) {
                    manualBtn.href = storeUrl;
                    manualBtn.textContent = "アプリをインストールする";
                } else {
                    manualBtn.href = "index.html";
                    manualBtn.textContent = "ホームに戻る";
                }
                manualBtn.style.display = "inline-block";
                document.querySelector(".redirect-text").textContent = "アプリが見つかりませんでした";
                document.querySelector(".redirect-spinner").style.display = "none";
            }

            window.location.href = APP_SCHEME;
            const fallbackTimer = setTimeout(goToStoreOrFallback, 1800);
            document.addEventListener("visibilitychange", () => {
                if (document.hidden) clearTimeout(fallbackTimer);
            });

        } else {
            // ===== PC: アプリ起動は試みず、QRコードを表示する =====
            document.getElementById("mobileBox").style.display = "none";
            const qrBox = document.getElementById("qrBox");
            qrBox.style.display = "flex";

            // このページ自身のURLをQRコードにする(スマホで読み取ると、上のスマホ用ロジックが動く)
            const pageUrl = window.location.origin + window.location.pathname;
            const qrApiUrl = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(pageUrl);
            document.getElementById("qrImage").src = qrApiUrl;
        }
    </script>
</body>
</html>
